name: Release Publisher
permissions:
  contents: read
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+"
jobs:
  gradle-wrapper-validation:
    uses: ./.github/workflows/gradle-wrapper-validation.yml
  build:
    needs: gradle-wrapper-validation
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check NO SNAPSHOT version suffix
        run: if [[ $(cat gradle.properties | grep version= | sed 's/^version=//') =~ .*-SNAPSHOT ]]; then exit 1; else exit 0; fi
      - name: Check tag matches gradle.properties version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(grep '^version=' gradle.properties | sed 's/^version=//')
          if [[ "$TAG_NAME" != "$VERSION" ]]; then
            echo "Tag $TAG_NAME does not match gradle.properties version $VERSION"
            exit 1
          fi
      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 11
          distribution: 'zulu'
          cache: 'gradle'
      - name: Make gradlew Executable
        run: chmod +x gradlew
      - name: Gradle Check project
        run: ./gradlew --no-daemon -PreleaseBuild=true check
      - name: Publish with Gradle
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGKEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGPASSWORD }}
          SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
          SONATYPE_TOKEN: ${{ secrets.SONATYPE_TOKEN }}
        run: ./gradlew --no-daemon -PreleaseBuild=true publish
      - name: Central Portal manual Repo Close
        # Details at https://central.sonatype.org/publish/publish-portal-ossrh-staging-api/#configuring-the-repository
        env:
          SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
          SONATYPE_TOKEN: ${{ secrets.SONATYPE_TOKEN }}
        run: |
          BEARER_TOKEN=$(printf "$SONATYPE_USER:$SONATYPE_TOKEN" | base64)
          curl -i --retry 5 -H "Authorization: Bearer $BEARER_TOKEN" -X POST https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/com.apple
          echo "Go to https://central.sonatype.com/publishing/deployments to finish publishing artifacts"
